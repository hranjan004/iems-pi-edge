# Cloud side of the IEMS split. Always-on services only.
# Every node runs EdgeLake, built from the commit the Pi runs (see README.md).
# Batch jobs (label review, retraining) run on separate on-demand instances.
#
# All addresses and credentials come from cloud/.env (see .env.example).
# Services bind to the Tailscale address only. Nothing is published publicly.
#
#   docker compose --env-file .env up -d
#
# Never run `docker compose down` on a shared compose project. Stop services by name.

name: iems-cloud

x-edgelake-env: &edgelake_env
  COMPANY_NAME: IEMS
  LEDGER_CONN: ${TAILNET_IP}:32048
  OVERLAY_IP: ${TAILNET_IP}
  TCP_BIND: "false"
  REST_BIND: "false"
  BLOCKCHAIN_SOURCE: master
  BLOCKCHAIN_SYNC: 60 seconds
  # A node needs a system_query database to issue network queries. Tested 2026-10-09:
  # without it a network query fails with "DBMS not open".
  SYSTEM_QUERY: "true"
  MEMORY: "true"
  NODE_MONITORING: "false"
  STORE_MONITORING: "false"
  SYSLOG_MONITORING: "false"
  DOCKER_MONITORING: "false"
  DISABLE_CLI: "true"

services:
  master:
    image: ${EDGELAKE_IMAGE}
    container_name: edgelake-master
    restart: unless-stopped
    environment:
      <<: *edgelake_env
      NODE_TYPE: master
      NODE_NAME: iems-master
      ANYLOG_SERVER_PORT: "32048"
      ANYLOG_REST_PORT: "32049"
      DB_TYPE: sqlite
    ports:
      - "${TAILNET_IP}:32048:32048"
      - "${TAILNET_IP}:32049:32049"
    volumes:
      # Pinned deployment scripts, the same commit the Pi runs
      - ${EDGELAKE_SCRIPTS_DIR}:/app/deployment-scripts:ro
      - master-blockchain:/app/EdgeLake/blockchain
      - master-data:/app/EdgeLake/data

  archive:
    image: ${EDGELAKE_IMAGE}
    container_name: edgelake-archive
    restart: unless-stopped
    depends_on:
      master:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      <<: *edgelake_env
      NODE_TYPE: operator
      NODE_NAME: iems-archive
      CLUSTER_NAME: iems-archive-cluster
      ANYLOG_SERVER_PORT: "32158"
      ANYLOG_REST_PORT: "32159"
      DEFAULT_DBMS: customers
      DB_TYPE: psql
      DB_USER: ${POSTGRES_USER}
      DB_PASSWD: ${POSTGRES_PASSWORD}
      DB_IP: postgres
      DB_PORT: "5432"
      # Partition retention is enforced by a drop job tied to partitioning, so keep a
      # large count rather than disabling it: 120 monthly partitions is ten years.
      PARTITION_INTERVAL: 30 days
      PARTITION_KEEP: "120"
      ARCHIVE_DELETE: "7"
      # The MCP client in the remote GUI connects here, not to the Pi.
      ENABLE_MCP: "true"
    ports:
      - "${TAILNET_IP}:32158:32158"
      - "${TAILNET_IP}:32159:32159"
    volumes:
      # Pinned deployment scripts, the same commit the Pi runs
      - ${EDGELAKE_SCRIPTS_DIR}:/app/deployment-scripts:ro
      - archive-blockchain:/app/EdgeLake/blockchain
      - archive-data:/app/EdgeLake/data

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: customers
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d customers"]
      interval: 10s
      retries: 5

  iems-gui:
    image: ${IEMS_GUI_IMAGE}
    container_name: iems-gui
    restart: unless-stopped
    depends_on: [archive]
    environment:
      REMOTE_GUI_BE: "8000"
      REMOTE_GUI_FE: "31800"
      # Network queries go to the archive node, which routes them to the Pi when needed.
      ANYLOG_REST_URL: http://${TAILNET_IP}:32159
      ANYLOG_USER_AGENT: AnyLog/1.23
      ANYLOG_MCP_SSE_URL: http://${TAILNET_IP}:32159/mcp/sse
      IEMS_BACKEND_URL: http://${PI_TAILNET_IP}:8009
      IEMS_DASH_URL: http://${PI_TAILNET_IP}:47821
      LLM_API_TYPE: ${LLM_API_TYPE}
      LLM_ENDPOINT: ${LLM_ENDPOINT}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      HOUSE_TZ: America/Los_Angeles
    ports:
      - "${TAILNET_IP}:3001:31800"
      - "${TAILNET_IP}:8000:8000"

volumes:
  master-blockchain:
  master-data:
  archive-blockchain:
  archive-data:
  pgdata:
