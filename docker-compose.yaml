# ═══════════════════════════════════════════════════════════════════════════
# Microgrid IEMS — full-stack deploy
# ═══════════════════════════════════════════════════════════════════════════
# Brings up every service required to run the IEMS at a residential site:
#
#   postgres    → time-series store backing AnyLog
#   master      → AnyLog metadata node (blockchain, policies)
#   operator1   → AnyLog operator (Kafka consumer, REST/TCP, writes Postgres)
#   kafka       → KRaft broker
#   kafka-ui    → web inspector at :8080
#   egauge-producer  → polls the eGauge meter, publishes to Kafka
#   anylog-consumer  → optional Kafka → AnyLog HTTP bridge
#   ollama      → local LLM for the DSS layer
#   iems-app    → FastAPI backend + React frontend (port 8000 / 3001)
#   iems-inference → NILM ONNX disaggregator loop (writes nilm_disaggregated)
#   iems-dashboard → zero-dep Node live dashboard (port 47821)
#
# Start everything:   docker compose up -d
# Tear down:          docker compose down
# Logs for one:       docker compose logs -f iems-inference
# ═══════════════════════════════════════════════════════════════════════════

services:

  # ── Postgres ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:14.0-alpine
    container_name: postgres1
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-customers}
      POSTGRES_INITDB_ARGS: "--auth=md5"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./streaming/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-customers}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── AnyLog metadata node ─────────────────────────────────────────────────
  master:
    image: anylogco/anylog-network:ucsc-arm
    container_name: master
    restart: always
    stdin_open: true
    tty: true
    env_file:
      - ./streaming/anylog/docker-makefiles/master-configs/base_configs.env
      - ./streaming/anylog/docker-makefiles/master-configs/advance_configs.env
      - ./streaming/anylog/docker-makefiles/.env
    environment:
      ANYLOG_LICENSE: ${ANYLOG_LICENSE}
      AKAVE_ACCESS_KEY_RC2: ${AKAVE_ACCESS_KEY_RC2}
      AKAVE_SECRET_KEY_RC2: ${AKAVE_SECRET_KEY_RC2}
      AKAVE_ENDPOINT_RC2: ${AKAVE_ENDPOINT_RC2}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "32048:32048"
      - "32049:32049"
    volumes:
      - master-anylog:/app/AnyLog-Network/anylog
      - master-blockchain:/app/AnyLog-Network/blockchain
      - master-data:/app/AnyLog-Network/data
    depends_on:
      postgres:
        condition: service_healthy

  # ── AnyLog operator node ─────────────────────────────────────────────────
  operator1:
    image: anylogco/anylog-network:ucsc-arm
    container_name: operator1
    restart: always
    stdin_open: true
    tty: true
    env_file:
      - ./streaming/anylog/docker-makefiles/operator1-configs/base_configs.env
      - ./streaming/anylog/docker-makefiles/operator1-configs/advance_configs.env
      - ./streaming/anylog/docker-makefiles/.env
    environment:
      ANYLOG_LICENSE: ${ANYLOG_LICENSE}
      AKAVE_ACCESS_KEY_RC2: ${AKAVE_ACCESS_KEY_RC2}
      AKAVE_SECRET_KEY_RC2: ${AKAVE_SECRET_KEY_RC2}
      AKAVE_ENDPOINT_RC2: ${AKAVE_ENDPOINT_RC2}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "32148:32148"
      - "32149:32149"
      - "1883:1883"
    volumes:
      - operator1-anylog:/app/AnyLog-Network/anylog
      - operator1-blockchain:/app/AnyLog-Network/blockchain
      - operator1-data:/app/AnyLog-Network/data
      - operator1-external-lib:/app/AnyLog-Network/external_lib
      - operator1-local-scripts:/app/deployment-scripts
      # Permanent overrides: bypass startup script rebuild
      - ./streaming/anylog/docker-makefiles/operator1-configs/local_script.al:/app/deployment-scripts/node-deployment/local_script.al:ro
      - ./streaming/anylog/docker-makefiles/operator1-configs/patches/validate_node_policy.al:/app/deployment-scripts/node-deployment/policies/validate_node_policy.al:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      master:
        condition: service_started
      postgres:
        condition: service_healthy

  # ── Kafka (KRaft mode) ───────────────────────────────────────────────────
  kafka:
    image: apache/kafka:3.9.2
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://host.docker.internal:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_LOG_SEGMENT_BYTES: 104857600
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: microgrid
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # ── eGauge → Kafka producer ──────────────────────────────────────────────
  egauge-producer:
    build:
      context: ./streaming/kafka-egauge-pipeline
      dockerfile: Dockerfile.producer
    container_name: egauge-producer
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      EGAUGE_URI: ${EGAUGE_URI}
      EGAUGE_USER: ${EGAUGE_USER}
      EGAUGE_PASS: ${EGAUGE_PASS}
      KAFKA_BROKER: "kafka:9092"
      KAFKA_TOPIC: "egauge-energy"
      POLL_INTERVAL: "1"
    depends_on:
      kafka:
        condition: service_healthy

  # ── Optional: Kafka → AnyLog HTTP bridge (fallback path) ─────────────────
  anylog-consumer:
    build:
      context: ./streaming/kafka-egauge-pipeline
      dockerfile: Dockerfile.consumer
    container_name: anylog-consumer
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      KAFKA_BROKER: "kafka:9092"
      KAFKA_TOPIC: "egauge-energy"
      KAFKA_GROUP: "anylog-bridge"
      ANYLOG_HOST: "host.docker.internal"
      ANYLOG_PORT: "32149"
      ANYLOG_DBMS: "customers"
      ANYLOG_TABLE: "energy_readings"
    depends_on:
      kafka:
        condition: service_healthy
      operator1:
        condition: service_started

  # ── Solar Assistant → AnyLog producer ───────────────────────────
  solar-producer:
    build:
      context: ./streaming/solar-pipeline
      dockerfile: Dockerfile
    container_name: solar-producer
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SA_BROKER: ${SA_BROKER}
      SA_PORT: ${SA_PORT}
      SA_USER: ${SA_USER}
      SA_PASS: ${SA_PASS}
      SA_PREFIX: ${SA_PREFIX}
      ANYLOG_HOST: "host.docker.internal"
      ANYLOG_PORT: "32149"
      ANYLOG_DBMS: "customers"
      ANYLOG_TABLE: "solar_data"
      INTERVAL: "5"
      # AnyLog is the broker: publish JSON to its MQTT broker; a run msg client
      # maps topic 'solar' -> solar_data. Set INGEST_MODE=rest for streaming PUT.
      INGEST_MODE: "broker"
      ANYLOG_BROKER: "host.docker.internal"
      ANYLOG_BROKER_PORT: "1883"
      ANYLOG_TOPIC: "solar"
    depends_on:
      operator1:
        condition: service_started

  # ── Ollama (local LLM for DSS narrative) ─────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── IEMS FastAPI + React frontend (port 8000 / 3001) ─────────────────────
  iems-app:
    # Was: build: ./services/remote-gui (fork of royshadmon/Microgrid-UCSC).
    # Now an overlay on upstream anylogco/remote-gui:2.1.2-beta that re-adds the
    # IEMS plugin and wires the MCP client to the local LLM. Build it with:
    #   docker build -t iems-remote-gui:2.1.2-beta ./services/remote-gui-overlay-212
    image: iems-remote-gui:2.1.2-beta
    container_name: iems-app
    restart: unless-stopped
    ports:
      # External ports deliberately unchanged. 2.1.1-beta defaults to BE 8080 /
      # FE 31800, but 8080 collides with kafka-ui and :8000/iems/* is wired into
      # iems-dashboard and the ONNX smoke tests, so the backend is pinned back to
      # 8000 via REMOTE_GUI_BE and the frontend is remapped 3001 -> 31800.
      - "8000:8000"
      - "3001:31800"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      REMOTE_GUI_BE: "8000"
      REMOTE_GUI_FE: "31800"
      VITE_API_URL: "http://localhost:8000"
      ANYLOG_REST_URL: "http://host.docker.internal:32149"
      ANYLOG_HOST: "host.docker.internal"
      ANYLOG_REST_PORT: "32149"
      ANYLOG_USER_AGENT: "AnyLog/1.23"
      OLLAMA_URL: "http://host.docker.internal:11434"
      PYTHONPATH: "/app:/app/services"
      HOUSE_LAT: ${HOUSE_LAT:-37.24}
      HOUSE_LON: ${HOUSE_LON:--121.96}
      HOUSE_TZ: ${HOUSE_TZ:-America/Los_Angeles}
      REACT_APP_API_URL: "http://localhost:8000"
      PGHOST: "host.docker.internal"
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-customers}
      PGUSER: "demo"
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me}
      # MCP client -> AnyLog's native MCP server on operator1, driven by the
      # local Ollama model. IEMS_BACKEND_URL/IEMS_DASH_URL are what the IEMS
      # plugin proxies to for engine calls and the embedded dashboard.
      ANYLOG_MCP_SSE_URL: "http://host.docker.internal:32149/mcp/sse"
      LLM_ENDPOINT: "http://host.docker.internal:11434"
      LLM_API_TYPE: "ollama"
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b-instruct}
      IEMS_BACKEND_URL: "http://host.docker.internal:8009"
      IEMS_DASH_URL: "http://host.docker.internal:47821"
    volumes:
      # Hot-reload Python without rebuilds
      - ./services/iems:/app/services/iems:ro
      - ./services/remote-gui-overlay-212/backend/iems/iems_router.py:/app/CLI/local-cli-backend/plugins/iems/iems_router.py:ro
    depends_on:
      - ollama
      - operator1

  # ── IEMS NILM inference loop ─────────────────────────────────────────────
  iems-inference:
    build:
      context: .
      dockerfile: ./services/iems/inference/Dockerfile
    container_name: iems-inference
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ANYLOG_HOST: "host.docker.internal"
      ANYLOG_REST_PORT: "32149"
      HOUSE_LAT: ${HOUSE_LAT:-37.24}
      HOUSE_LON: ${HOUSE_LON:--121.96}
      HOUSE_TZ: ${HOUSE_TZ:-America/Los_Angeles}
      PGHOST: "host.docker.internal"
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-customers}
      PGUSER: "demo"
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me}
    command: ["--tick", "${INFERENCE_TICK_SECONDS:-30}"]
    depends_on:
      - operator1

  # ── IEMS live dashboard (port 47821) ─────────────────────────────────────
  iems-dashboard:
    build:
      context: .
      dockerfile: ./services/iems/web/Dockerfile
    container_name: iems-dashboard
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "47821:47821"
    environment:
      ANYLOG_HOST: "host.docker.internal"
      ANYLOG_PORT: "32149"
      IEMS_HOST: "host.docker.internal"
      IEMS_PORT: "8009"
      HA_URL: ${HA_URL:-http://192.168.1.69:8123}
      HA_TOKEN_FILE: "/app/.ha_token"
    volumes:
      # The container has no writable layer worth trusting: docker cp'ing the
      # token in is lost on every rebuild, which silently disables the
      # thermostat controls. Mount it read-only instead.
      - ${HA_TOKEN_PATH:-/home/microgrid/ha_token.txt}:/app/.ha_token:ro
    depends_on:
      - iems-app

volumes:
  pgdata:
  kafka_data:
  ollama-data:
  master-anylog:
  master-blockchain:
  master-data:
  operator1-anylog:
  operator1-blockchain:
  operator1-data:
  operator1-external-lib:
  operator1-local-scripts:
