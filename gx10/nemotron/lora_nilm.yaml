# LoRA SFT of NVIDIA Nemotron 3.5 Lightning 30B-A3B (BF16) as a NILM classifier
# that reproduces the gated BiLSTM decisions of each panel.
#
# Derived from NeMo AutoModel's
# examples/llm_finetune/nemotron/nemotron_nano_v3_5_lightning_singlegpu_lora.yaml
# (single GPU, every parallel axis at one, activation checkpointing and
# memory-efficient LoRA; NVIDIA runs it in CI on a GB10). Changes: our chat
# JSONL instead of HellaSwag, a larger adapter, a real schedule, validation
# loss, and paths under /workspace. gx10/nemotron/recurrent_rounds.py
# overrides max_steps / restore_from per round on the command line.

recipe: TrainFinetuneRecipeForNextTokenPrediction

step_scheduler:
  global_batch_size: 16
  local_batch_size: 2
  ckpt_every_steps: 200
  val_every_steps: 200
  max_steps: 400

dist_env:
  backend: nccl
  timeout_minutes: 10

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 2026
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: /workspace/hf/Nemotron-3.5-Lightning-BF16
  num_nextn_predict_layers: 2
  mtp_use_repeated_layer: true
  mtp_loss_scaling_factor: 0.1
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: te
    linear: torch
    rms_norm: torch_fp32
    experts: torch_mm
    dispatcher: torch

compile:
  enabled: false

checkpoint:
  enabled: true
  checkpoint_dir: /workspace/ckpt/nilm_lora/
  model_save_format: safetensors
  save_consolidated: false

peft:
  _target_: nemo_automodel.components._peft.lora.PeftConfig
  exclude_modules: ["*.out_proj"]   # Mamba out_proj takes its weight directly
  dim: 16
  alpha: 32
  use_triton: true
  use_memory_efficient_lora: true

distributed:
  strategy: fsdp2
  dp_size: 1
  tp_size: 1
  cp_size: 1
  ep_size: 1
  sequence_parallel: false
  activation_checkpointing: true

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

dataset:
  _target_: nemo_automodel.components.datasets.llm.chat_dataset.ChatDataset
  path_or_dataset_id: /workspace/data/sft/train_round.jsonl
  seq_length: 1536

packed_sequence:
  packed_sequence_size: 0

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater
  shuffle: true

validation_dataset:
  _target_: nemo_automodel.components.datasets.llm.chat_dataset.ChatDataset
  path_or_dataset_id: /workspace/data/sft/val_small.jsonl
  seq_length: 1536

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater

optimizer:
  _target_: torch.optim.AdamW
  betas: [0.9, 0.95]
  eps: 1.0e-8
  lr: 1.0e-4
  weight_decay: 0.01

lr_scheduler:
  lr_decay_style: cosine
  lr_warmup_steps: 20
  # One cosine over ALL recurrent rounds. The scheduler state is restored with
  # the checkpoint and by default its values win over this file, which left
  # round 2+ at min_lr 1e-5 in the first GX10 run. override makes this file win.
  lr_decay_steps: 2000
  override_opt_param_scheduler: true
  use_checkpoint_opt_param_scheduler: false
  min_lr: 1.0e-5
